<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniAsk AI 预览</title>
  <style>
    :root{--bg:#f5efe6;--card:#fffdfa;--ink:#18313a;--muted:#67706d;--line:rgba(24,49,58,.12);--teal:#0f766e;--gold:#b88628;--bad:#b64539}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at top,rgba(15,118,110,.12),transparent 26%),linear-gradient(180deg,#fbf7f1,var(--bg));color:var(--ink);padding:26px 14px}
    button,input,textarea{font:inherit}a{color:inherit;text-decoration:none}.shell{max-width:980px;margin:0 auto}.card{background:rgba(255,255,255,.84);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 18px 60px rgba(18,35,42,.12)}
    h1{margin:0;font-size:36px;letter-spacing:-.04em}p{margin:10px 0 0;color:var(--muted);line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.full{grid-column:1/-1}
    label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}input,textarea{width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:#fff}textarea{min-height:190px;resize:vertical}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:999px;padding:11px 18px;cursor:pointer}.btn.primary{background:var(--teal);color:#fff}.btn.gold{background:var(--gold);color:#fff}.btn.outline{background:#fff;border:1px solid var(--line)}
    .note,.answer{display:none;margin-top:18px;padding:16px 18px;border-radius:18px;line-height:1.8;white-space:pre-wrap}.note{background:rgba(182,69,57,.08);border:1px solid rgba(182,69,57,.18);color:var(--bad)}.answer{background:rgba(15,118,110,.08);border:1px solid rgba(15,118,110,.18)}
    .tips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.tip{padding:14px;border-radius:18px;background:rgba(255,255,255,.62)}.tip strong{display:block;margin-bottom:8px}
    @media (max-width:760px){.grid,.tips{grid-template-columns:1fr}.card{padding:18px}h1{font-size:28px}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1>AI 回答预览</h1>
      <p>这里会直接调用后端的 AI 预览接口。页面会复用主站登录后保存在浏览器里的 `uniask_token`，因此建议先在首页完成登录。</p>
      <div class="tips">
        <div class="tip"><strong>写清课程名</strong><span>AI 会根据课程上下文调整解释方向。</span></div>
        <div class="tip"><strong>问题别太短</strong><span>补充背景和你已经尝试过的思路，回答会更靠谱。</span></div>
        <div class="tip"><strong>先预览再提问</strong><span>适合先快速看一版思路，再决定是否发到正式问答区。</span></div>
      </div>
      <div class="grid">
        <div><label for="course-name">课程名称</label><input id="course-name" placeholder="例如：数据结构"></div>
        <div><label for="question-title">问题标题</label><input id="question-title" placeholder="例如：红黑树和 AVL 树有什么区别？"></div>
        <div class="full"><label for="question-content">问题详情</label><textarea id="question-content" placeholder="补充你的背景、困惑点、报错信息，或者你已经尝试过的方法。"></textarea></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="submit-btn">生成 AI 回答</button>
        <a class="btn outline" href="/index.html">返回首页</a>
        <a class="btn outline" href="/manage.html">前往管理中心</a>
      </div>
      <div id="error-box" class="note"></div>
      <div id="answer-box" class="answer"></div>
    </div>
  </div>
  <script>
    const submitBtn=document.getElementById('submit-btn'),errorBox=document.getElementById('error-box'),answerBox=document.getElementById('answer-box');
    const showError=text=>{errorBox.textContent=text;errorBox.style.display='block'},showAnswer=text=>{answerBox.textContent=text;answerBox.style.display='block'},reset=()=>{errorBox.style.display='none';answerBox.style.display='none';errorBox.textContent='';answerBox.textContent=''};
    submitBtn.addEventListener('click',async()=>{reset();const token=localStorage.getItem('uniask_token');if(!token)return showError('未检测到登录状态，请先回首页登录。');const courseName=document.getElementById('course-name').value.trim(),title=document.getElementById('question-title').value.trim(),content=document.getElementById('question-content').value.trim();if(!courseName||!title||!content)return showError('课程名称、问题标题和问题详情都需要填写。');submitBtn.disabled=true;submitBtn.textContent='生成中...';try{const r=await fetch(`${window.location.origin}/api/questions/preview-ai`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({courseName,title,content})});const text=await r.text();let data=text;try{data=JSON.parse(text)}catch{}if(!r.ok)return showError(typeof data==='object'&&data?.message?data.message:(text||'请求失败'));showAnswer(typeof data==='string'?data:JSON.stringify(data,null,2))}catch(e){showError(`调用失败：${e.message}`)}finally{submitBtn.disabled=false;submitBtn.textContent='生成 AI 回答'}});
  </script>
</body>
</html>
