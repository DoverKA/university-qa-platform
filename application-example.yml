spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/你的数据库名?useUnicode=true&characterEncoding=utf8&useSSL=false
    username: root
    password: 你的数据库密码
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5Dialect

jwt:
  secret: 随便写一个长字符串
  expiration: 86400000

ai:
  api:
    key: 你的Anthropic API密钥（没有可以不填）
    url: https://api.anthropic.com/v1/messages
  model: claude-sonnet-4-20250514

server:
  port: 8080
